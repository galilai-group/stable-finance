[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stable-finance"
version = "0.1.0"
description = "Composable evaluation for financial forecasts and portfolios"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
mds = [
    "joblib>=1.5.0",
    "mosaicml-streaming>=0.10.0",
    "pandas>=2.3.0",
    "tqdm>=4.67.0",
    "zstandard>=0.25.0",
]
hf = [
    "huggingface-hub>=0.30",
]

# Optional constrained joint planning and actual-state trading backend.
joint = [
    "osqp>=1.0,<2",
    "scipy>=1.14.1",
]

[project.scripts]
# The data-preparation CLIs, in pipeline order. Each reads its default paths
# from the environment (RAW_DATA_DIR, METADATA_PATH, MOSAIC_DIR, HOLIDAY_CSV,
# DAYSTORE_DIR, ...) so a consumer repo sets them once.
sf-shard-months = "stable_finance.dataset.datasets.market1t.ingest:shard_main"  # Market-1T: raw parquet -> sparse MDS, all months
sf-write-mds = "stable_finance.dataset.datasets.market1t.ingest:main"           # Market-1T: one range, or --risk-factors
sf-densify = "stable_finance.dataset.datasets.market1t.mosaic:densify_main"      # sparse MDS -> dense sessions
sf-build-targets = "stable_finance.dataset.datasets.market1t.tables:main"         # per-month cross-section tables
sf-daystore = "stable_finance.dataset.datasets.market1t.daystore:main"           # dense MDS -> day-major store
sf-industry-map = "stable_finance.dataset.datasets.market1t.ingest:industry_main"      # Market-1T: (month, ticker) -> FF49
sf-reshard = "stable_finance.dataset.datasets.market1t.mosaic:reshard_main"      # date-ordered copy of a month

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stable_finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
