[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stable-finance"
version = "0.1.0"
description = "Composable evaluation for financial forecasts and portfolios"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
mds = [
    "joblib>=1.5.0",
    "mosaicml-streaming>=0.10.0",
    "pandas>=2.3.0",
    "tqdm>=4.67.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stable_finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
