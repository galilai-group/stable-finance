[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stable-finance"
version = "0.1.0"
description = "Composable evaluation for financial forecasts and portfolios"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stable_finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]

